# Render Blueprint: New → Blueprint → pick this repo.
# Values marked sync: false are asked for when you create the Blueprint.
services:
  - type: web
    name: encrypta
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt # match your Neon region: oregon, ohio, virginia, frankfurt or singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_SSL
        value: "false"
